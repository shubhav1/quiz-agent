name: answer-rounds

on:
  schedule:
    # Every 15 minutes, off the top of the hour (GitHub's busiest, most-delayed slot).
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: answer-rounds
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Solve new rounds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py
      - name: Commit and push
        run: |
          git config user.name "quiz-agent"
          git config user.email "quiz-agent@users.noreply.github.com"
          git add answers
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Answer rounds $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 10; done
          exit 1
